# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
# Releases are published by .github/workflows/release.yml when a v* tag is pushed.
# Check locally with: goreleaser release --snapshot --clean

version: 2

builds:
  - env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    goos:
      - linux
      - windows
      - darwin
    goarch:
      - amd64
      - arm64

archives:
  - formats: [tar.gz]
    # This name template makes the OS and Arch compatible with the results of `uname`.
    name_template: >-
      {{ .ProjectName }}_
      {{- title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else }}{{ .Arch }}{{ end }}
    format_overrides:
      - goos: windows
        formats: [zip]

dockers_v2:
  - images:
      # GITHUB_REPOSITORY is set in GitHub Actions, the default keeps local snapshots working.
      - 'ghcr.io/{{ envOrDefault "GITHUB_REPOSITORY" "paulden/libertea" | tolower }}'
    dockerfile: goreleaser.Dockerfile
    platforms:
      - linux/amd64
      - linux/arm64
    # `latest` follows the main branch, see .github/workflows/image.yml.
    tags:
      - "{{ .Version }}"
      - "{{ if not .Prerelease }}{{ .Major }}.{{ .Minor }}{{ end }}"
      - "{{ if not .Prerelease }}{{ .Major }}{{ end }}"
    labels:
      org.opencontainers.image.title: "{{ .ProjectName }}"
      org.opencontainers.image.description: "TUI stratagem hero to train your Helldivers 2 stratagem codes"
      org.opencontainers.image.source: "{{ .GitURL }}"
      org.opencontainers.image.version: "{{ .Version }}"
      org.opencontainers.image.revision: "{{ .FullCommit }}"
      org.opencontainers.image.created: "{{ .Date }}"
    # Provenance is attested by GitHub in release.yml: in-manifest attestations would show up
    # as unknown/unknown platforms in the package page.
    sbom: false
    flags:
      - --provenance=false

checksum:
  name_template: checksums.txt

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"

release:
  # Tags such as v1.3.0-rc.1 are published as pre-releases and never become the latest release.
  prerelease: auto
  footer: >-

    ---

    Released by [GoReleaser](https://github.com/goreleaser/goreleaser).
